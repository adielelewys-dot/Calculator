name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Arrange sources
        run: |
          mkdir -p src/main/kotlin/com/example/calculator
          mv MainActivity.kt Calculator.kt src/main/kotlin/com/example/calculator/
          mv AndroidManifest.xml src/main/

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Calculator build ${{ github.run_number }}
          files: build/outputs/apk/debug/app-debug.apk
